<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- App icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32"   href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <title>Calm Cockpit v2</title>
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=21">
</head>
<body>

    <nav class="view-nav" aria-label="Views">
        {% for key, label, endpoint in [('overview', 'Overview', 'index'), ('academics', 'Academics', 'academics'), ('gym', 'Gym', 'gym'), ('scrapbook', 'Scrapbook', 'scrapbook')] %}
        <a class="view-nav-tab{% if active_view == key %} active{% endif %}" href="{{ url_for(endpoint) }}"{% if active_view == key %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
    </nav>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/icons.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=13"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
